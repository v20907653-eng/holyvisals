<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаунчер — Скачать</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный градиентный фон */
        body::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, #6a11cb, #2575fc, #00d2ff, #6a11cb);
            animation: rotate 12s linear infinite;
            z-index: -2;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10,10,26,0.85), rgba(10,10,26,0.98));
            z-index: -1;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 70px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease;
            max-width: 90vw;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 22px;
            background: linear-gradient(135deg, #2575fc, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            box-shadow: 0 10px 30px rgba(37, 117, 252, 0.5);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        h1 {
            color: #fff;
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 50px;
            font-size: 19px;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #2575fc, #00d2ff);
            background-size: 200% 200%;
            box-shadow: 0 10px 30px rgba(37, 117, 252, 0.5);
            transition: all 0.3s ease;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 45px rgba(0, 210, 255, 0.6);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn svg {
            width: 24px;
            height: 24px;
            animation: bounce 1.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }

        .info {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🚀</div>
        <h1>Лаунчер</h1>
        <p>Скачай последнюю версию лаунчера и начни прямо сейчас</p>

        <a class="btn"
           href="https://drive.usercontent.google.com/download?id=1FYH_yBBSDb38OytiIRBU6mtLs1K-eIOm&export=download&authuser=0&confirm=t&uuid=38e7c6a0-143a-4cc8-aee7-15ebfe6de133&at=AMrWOn35RoahpSB81M7XoWf_13Qr%3A1792850661855"
           target="_blank"
           rel="noopener">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
            </svg>
            Скачать лаунчер
        </a>

        <div class="info">Windows • Бесплатно • Безопасно</div>
    </div>
</body>
</html>
